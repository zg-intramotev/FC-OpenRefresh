<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- OpenRefresh: two stacked toolbar rows with a refresh arrow. Colours: open-color palette. -->
  <!-- Top row: small bar -->
  <rect x="4" y="6" width="40" height="10" rx="3" ry="3" fill="#adb5bd"/>
  <rect x="8" y="9.5" width="3" height="3" rx="1" fill="#495057"/>
  <rect x="14" y="9.5" width="3" height="3" rx="1" fill="#495057"/>
  <rect x="20" y="9.5" width="3" height="3" rx="1" fill="#495057"/>
  <!-- Bottom row: larger bar -->
  <rect x="4" y="20" width="56" height="20" rx="4" ry="4" fill="#495057"/>
  <rect x="9" y="25" width="10" height="10" rx="2" fill="#339af0"/>
  <rect x="23" y="25" width="10" height="10" rx="2" fill="#adb5bd"/>
  <!-- Refresh arrow: circular arc with arrowhead -->
  <circle cx="46" cy="46" r="15" fill="#37b24d"/>
  <path d="M 52.93 50 A 8 8 0 1 1 51.66 40.34" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 55.5 35.5 L 55.5 43.5 L 47.5 43.5 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
